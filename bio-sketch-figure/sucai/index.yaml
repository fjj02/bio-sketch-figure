# 通用元素素材库索引
# 出图时脚本会按当前页大纲里的关键词，从下面挑出「命中」的素材作为参考图发给绘图服务，
# 让模型直接复用这些元素的造型、结构与配色，从而提高科研结构准确性与跨页一致性。
#
# 字段说明：
#   id          素材唯一标识（英文小写+连字符，脚本内部用）
#   name        中文名称（会写进发给模型的角色说明，如「元素素材「线粒体」」）
#   keywords    命中关键词：当前页大纲文本里出现任意一个，该素材才会被选用
#   description 一句话描述（供人查看与维护）
#   file        素材文件（相对本目录）
#   transparent 是否透明底（false 表示带底色，作为参考图时可能带进背景，谨慎使用）
#
# 维护提示：新增素材后放进本目录并在下面补一条；未列入本索引的图片不会被使用，
#           运行 `check` 会提示「未入索引」的文件。

