instructions: |
  视觉风格要求（科研流程图 · 学术技术路线 / 架构图风格）：

  1. 整体风格
  - 学术技术路线图 / 系统架构图：高度结构化、层级分明、以信息传达为先
  - 扁平矢量为主，辅以轻阴影与细描边制造浮层感；无手绘、无写实纹理、无照片
  - 类似论文技术路线图、方法学框架图、期刊补充材料图的观感

  2. 结构与版式
  - 分层结构：金字塔 / 漏斗 / 同心环 / 等轴测堆叠，体现「目标→方法→结果」或「数据→模型→应用」的递进
  - 建议三段式垂直布局：顶部标题或目标、中部主体流程、底部结果 / 输出
  - 模块用圆角矩形、六边形、梯形、椭圆等几何形状承载；同类模块造型统一
  - 模块间距均匀、留白充分；可用极浅色底纹或虚线框做软分区
  - 关键枢纽置于视觉中心，向四周辐射连接

  3. 配色方案
  - 主色：深蓝紫 / 蓝灰 / 浅灰蓝，理性、克制
  - 背景：纯白或极浅灰，无纹理、无噪点
  - 强调色：仅在关键分支、结论或预警节点使用红 / 橙，局部点睛，不大面积铺色
  - 文字用深灰（非纯黑）；标题可用白字配深色底块

  4. 连接与箭头
  - 实线箭头：主流程 / 数据流方向
  - 虚线箭头：依赖、反馈、循环、间接关系
  - 双向箭头：协同 / 迭代关系
  - 箭头语义保持一致，避免交叉与歧义

  5. 文字与标注
  - 中文字体用思源黑体 / 微软雅黑；英文用 Helvetica / Arial
  - 字号分层：标题 > 模块名 > 子项 / 注释
  - 模块内文字居中或左对齐，关键术语加粗；缩写首次出现时给出全称
  - 箭头旁可用简短动词短语说明动作（如「筛选」「验证」「整合」）

  6. 细节
  - 可包含百分比圆标、编号标签、图例条等辅助元素，但保持克制
  - 不含真实照片与装饰性插画，所有元素都服务于逻辑链
