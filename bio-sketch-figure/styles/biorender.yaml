instructions: |
  视觉风格要求（BioRender 科研插画 · 2.5D 扁平微立体生物医学插画风格）：

  1. 整体风格
  - 现代学术矢量插画：扁平化基础上带轻微体积感（2.5D 伪立体），干净、严谨、专业
  - 介于纯扁平与写实 3D 之间：造型高度概括、边缘平滑，靠色块与柔和光影表现体积，无写实纹理、无照片感
  - 参考期刊 / 教材级机制示意图（BioRender 观感）：信息层级清晰、留白充足、克制不杂乱

  2. 配色方案
  - 低饱和柔和的莫兰迪 / 粉彩色系，避免荧光色与高饱和纯色
  - 语义化用色：同一类元素 / 同一通路用同一色系；正向 / 激活偏暖色，抑制 / 病理偏红或深色强调
  - 背景为纯白（#FFFFFF），不加底纹、网格或装饰
  - 文字与连线使用深灰（约 #333333，非纯黑），柔和不刺眼

  3. 线条与描边
  - 生物主体（器官、细胞、分子）不使用黑色硬描边：用同色系较深的颜色作细描边（约 1–1.5pt），或直接无色靠色块对比
  - 模块边框 / 分组线：极细的浅灰实线或浅灰虚线（约 1pt），低调不抢主体
  - 引线 / 连接线：深灰细线；连线尽量不交叉，走线整齐

  4. 光影与立体感
  - 体积感主要靠径向渐变与内阴影：光源统一在左上，元素中心偏亮、边缘偏暗，呈柔和球体 / 圆柱感
  - 哑光质感：无锐利高光、无塑料 / 果冻感，几乎不用外部投影
  - 病理 / 炎症 / 浸润等可用柔和的红色辉光（模糊扩散）强调，但边缘不硬

  5. 元素造型
  - 细胞：正圆或圆角形，内部放一个偏心的深色小圆代表细胞核，径向渐变体现球体感
  - 巨噬细胞 / 小胶质细胞：边缘带柔和伪足 / 星状突起，不出现尖锐锯齿
  - 细胞器 / 分子：几何化图标——线粒体为豆状 / 花生状（内含波浪状嵴）、离子 / 因子为小球、酶 / 受体为圆角矩形或桶状
  - 组织 / 器官：解剖结构高度简化，曲线用平滑贝塞尔，保留关键特征、去掉血肉细节
  - 器皿 / 标签：几何图形组合；文字框为带细描边的圆角矩形，与生物元素区分

  6. 箭头与连接线
  - 激活 / 转化 / 转运：深灰细实线 + 极简实心小三角箭头（或 V 形）
  - 抑制 / 阻断：标准 T 形线（末端带垂直短横），可用红色以强调
  - 间接 / 多步 / 病理改变：细虚线箭头
  - 局部放大：细虚线连接小图与大图；吸附 / 平衡关系可用平行双向半箭头
  - 箭头样式统一、比例克制，不喧宾夺主

  7. 文字与标注
  - 全图无衬线字体（Arial / Helvetica / Roboto 一类），深灰色
  - 层级分明：主标题最大且加粗；模块 / 次级标题居中加粗；正文与标签常规字重、字号更小
  - 过程 / 动作词（如 Activation、Expansion、Differentiation）与物种学名用斜体
  - 标注文字置于元素旁或圆角标签框内，不遮挡主体、不交叉

  8. 版式与构图
  - 模块化网格：按生物学逻辑分区（如左→右流程、上下总-分、2×2 或左右对照），用淡色圆角框 / 浅灰虚线分隔
  - 阅读方向遵循左→右、上→下；同一对照组的元素位置与大小保持对齐、可套准比较
  - 留白充足、信息密度适中，避免拥挤与线条交叉

  9. 分镜一致性
  - 同一系列各页保持同一套配色、同一种描边粗细与光影处理、同一字体层级
  - 同一元素（细胞 / 器官 / 分子）跨页保持相同的造型、比例与配色
