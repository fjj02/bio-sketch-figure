name: "平面矢量风格"
id: "flat"
tier: "free"
description: "简洁清晰的平面矢量科研配图风格，适合流程示意图和机制图解"
instructions: |
  视觉风格要求（平面矢量科研风格）：

  1. 整体风格
  - 平面矢量插画风格，2D 信息图表设计
  - 干净利落的线条，纯色填充（无渐变或极少渐变）
  - 无 3D 纹理，保持扁平化视觉效果
  - 背景为纯白色，确保高对比度和印刷清晰度
  - 适合 Mechanism Diagram、Pathway、流程图

  2. 配色方案
  - 柔和的学术配色盘：干枯玫瑰粉、鼠尾草绿、淡蓝、奶油色
  - 同一元素使用纯色填充，不同元素用不同颜色区分
  - 文字使用深炭灰色（#333），线框使用中灰色（#999）
  - 整体饱和度偏低，保持学术感

  3. 视觉元素
  - 分子/蛋白用简化的图标化表示（圆形、多边形组合）
  - 连接线为直线或直角线，末端带简洁箭头
  - 箭头使用三角形箭头（非有机箭头）
  - 分组使用虚线框或浅色背景框
  - 文本标签字号统一，使用无衬线字体

  4. 构图规范
  - 清晰的逻辑流（从左到右或从上到下）
  - 采用模块化布局，每个步骤一个独立区块
  - 区块之间用箭头连接，间距均匀
  - 整体构图对称、均衡

  5. 技术细节
  - 线宽统一（1.5-2px）
  - 圆角统一（4-6px）
  - 图标大小统一
  - 保持充足的留白，避免拥挤

palette:
  - "#D8A0A6"
  - "#A3B18A"
  - "#A7C7E7"
  - "#F5E6C8"
  - "#333333"
  - "#999999"
