name: "低饱和微立体学术风"
id: "modular-academic"
tier: "free"
description: "低饱和马卡龙配色的模块化微立体学术机制图：纯白背景、柔光哑光体积感、模块化网格与电路式逻辑线，标题衬线体，适合多模块机制/图文摘要"
reference_image: "assets/styles/modular-academic.jpg"
aspect_ratio: "3:4"
reference_max_kb: 350
palette:
  - "#E2EDF3"
  - "#A1C0D9"
  - "#E7D3D2"
  - "#E4997E"
  - "#C2E1D9"
  - "#2A4D7C"
