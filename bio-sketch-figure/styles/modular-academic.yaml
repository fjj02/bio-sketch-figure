  - "#8E7CC3"
instructions: |
  视觉风格要求（低饱和微立体学术风 · 模块化微立体科研机制图）：

  1. 整体风格
  - 清新、现代、严谨、高端的学术插图观感，信息高效、无冗余装饰
  - 「微立体 / 柔光伪 3D」：不是纯扁平，也不是写实 3D，而是用柔和光影与渐变赋予适度体积与哑光材质感
  - 模块化分区（如 a / b / c / d）把复杂过程拆解清楚，层级分明

  2. 配色方案
  - 低饱和马卡龙 / 冰淇淋色系，柔和护眼：浅水蓝、灰蓝、淡粉 / 肉色、珊瑚橘 / 砖红、薄荷绿
  - 用深蓝（约 #2A4D7C）作为标题与正文文字的主色锚点，压住轻盈的马卡龙色
  - 点睛色：警示红（约 #D64045，用于危险 / 凋亡 / 激活）、丁香紫（约 #8E7CC3，用于特定输入或核内 DNA）
  - 背景为纯白；局部可用极浅蓝到白的柔和径向 / 线性渐变烘托环境，但不干扰前景

  3. 线条与描边
  - 主体元素（细胞、分子、器官）不使用黑色硬描边：用同色系深色细描边（约 1–1.5pt）或完全去描边，仅靠光影区分边缘
  - 模块外框：淡蓝色圆角虚线或实线（约 1–1.5pt），用于分割又不生硬
  - 逻辑线：可使用电路图式的直线与直角折线（如逻辑门），带科技感

  4. 光影与立体感
  - 全局统一光源在左上 / 正上方（漫反射）
  - 哑光为主：大而边缘模糊的柔和高光，不反光；金属 / 无机材质（反应釜、喷头）可用灰白渐变 + 清晰线性高光
  - 悬浮元素（细胞、分子、文字标签盒）底部带非常柔和、低透明度（约 20%–30%）的浅灰 / 浅蓝投影，营造微立体悬浮感

  5. 元素造型
  - 细胞 / 微生物：有机态边缘；正常细胞圆润，肿瘤细胞表面有凹凸瘤状物，凋亡 / 焦亡细胞表面破裂、内容物外溢
  - 分子 / 离子：球棍或空间填充模型，完美圆形 + 径向渐变体现体积
  - 微观材料 / 纳米结构：几何严谨、孔洞细腻、内部加深阴影，具 3D 建模般的渲染质感
  - 宏观器官（如骨骼）：医学插画式，解剖结构准确、纹理清晰但配色经柔和化处理
  - 可用通用符号（如骷髅头 + 交叉骨代表细胞死亡）提升可读性与趣味性

  6. 箭头与连接线
  - 主流程箭头以平滑曲线引导视线；重要箭头可用同色系渐变填充，箭头头部为平滑等腰三角形并带微投影
  - 按语义区分：促进 / 转化用常规箭头；抑制用平头线 / T 形线；上调 / 增加用红色向上箭头
  - 逻辑门部分可用电路式直角折线

  7. 文字与字体
  - 模块标题（如 a: …）：衬线体（Times New Roman / Georgia 一类）加粗、深蓝色，体现学术权威感
  - 正文 / 标签：无衬线体（Arial / Helvetica 一类），常规或加粗，深蓝或黑色，保证小字号清晰
  - 关键因子 / 药物名按其性质用对应颜色（如氧化剂用红、材料用橘），必要时加胶囊 / 圆角底色块突出

  8. 版式与构图
  - 模块化网格（如 1+1+2 或 2×2）：分区尺寸协调，信息密度均匀，无明显头重脚轻
  - 阅读顺序从上到下、从左到右递进；模块内元素严格居中或基线对齐
  - 大量留白，连线尽量不交叉

  9. 分镜一致性
  - 同一系列各页保持同一套马卡龙配色、同一种描边与柔光处理、同一字体层级与模块框样式
  - 同一元素跨页保持相同造型、比例与配色
