instructions: |
  视觉风格要求（现代生医 2.5D 凝胶渲染风 · 轻拟物生物医学机制图）：

  1. 整体风格
  - 专业、严谨、现代、通透；信息量大但层级分明
  - 「2.5D 伪 3D / 轻拟物」：用渐变、高光与阴影模拟 3D 体积，元素呈水润的「凝胶 / 玻璃」质感
  - 画面干净、无杂乱黑边；可结合微观（分子 / 细胞器）与宏观（小鼠 / 实验流程）视角

  2. 配色方案
  - 冷暖对比：科技蓝（约 #89B5D4）用于正常细胞 / 免疫激活机制；肉粉色（约 #FAD7D5）用于肿瘤微环境 / 血管
  - 点缀：浅绿（约 #AFCCA6，抗原 / ROS）、淡黄（约 #F4E290，特定药物分子）
  - 强调 / 文字：深蓝（约 #1B437D）作标题与成熟细胞主色；鲜红（约 #D32F2F）用于上调、警示、激光
  - 背景：极浅蓝灰渐变（约 #EBF2FA → 纯白），无纹理图案

  3. 线条与描边
  - 去线化：主体元素（细胞、器官、小鼠）不用黑色实体描边，靠颜色对比、高光与阴影界定边缘
  - 功能性线条：细胞膜双分子层用小圆点 + 短线密排；化学结构式用纯黑细实线；基因螺旋用极细同色系描边

  4. 光影与立体感
  - 径向渐变 + 白色高光斑为核心：球体顶部有偏置的高光，底部较暗，圆润光泽
  - 内阴影：大而切开的主体（如被切开的细胞腔体）边缘用强内阴影营造凹陷 / 水滴内部的空间深度
  - 投影：悬浮元素（文字框、天平、部分细胞）下方带柔和、低透明度投影，拉开空间层次
  - 激光 / 光效：圆柱形器械发出带透明度的渐变发光射线（光晕）

  5. 元素造型
  - 化学分子：传统 2D 平面线段式，旁配对应颜色的 3D 小球建立联系
  - 纳米颗粒 / 团簇：多个带高光的小球紧密堆叠
  - 细胞：边缘不规则波浪或带触角（如 DC 细胞），表面有细微颗粒感或渐变光泽
  - 细胞器：具象化——线粒体画出内部嵴、内质网画出层叠管状，均带光影
  - 受体 / 配体（如 PD-L1 / PD-1）：高度符号化的 Y 型 / 柱型，靠颜色区分，结合处加高光提示
  - 小鼠：3D 写实渲染（哑光皮毛、体积阴影、真实形态）
  - 器械（手电 / 激光笔）：3D 圆柱 + 渐变发光射线

  6. 箭头与连接线
  - 主流程箭头：粗壮，内部由浅到深渐变，锐利三角箭头，带轻微立体感 / 阴影
  - 虚线箭头：表示趋势、间接作用或光线照射路径（如蓝 / 红虚线）
  - 抑制 / 阻断：标准 T 形线（末端带垂直短横）或红色「X」阻断符号
  - 动态指示：黑色 / 红色「↑」「↓」紧跟文字，表示浓度或表达升降

  7. 文字与字体
  - 全图无衬线字体（Arial / Helvetica 一类）
  - 分层用色：黑色 = 常规标签；深蓝 = 大标题 / 主要细胞类型 / 下调趋势；深红 = 微环境名称 / 警告 / 上调 / 免疫激活结果
  - 加粗用于强调核心结果或关键细胞；关键标签可加白色半透明圆角底框（带轻微投影）以防与复杂背景融合

  8. 版式与构图
  - 三段式 / 模块化：顶部为材料合成路径（线性、左→右）；中部为核心机制区（可左右分块或由隐喻元素如天平构成焦点）；底部为图例区
  - 阅读顺序：上→下、左→右；用红蓝对比在中央形成视觉焦点，再用粗箭头引导视线汇向最终结论
  - 图例区用细虚线框与主体软性分割；整体留白充足，连线尽量不交叉

  9. 分镜一致性
  - 同一系列各页保持同一套冷蓝 / 暖粉配色、同一种凝胶质感与光影方案、同一字体层级
  - 同一元素跨页保持相同造型、比例与配色
