name: "2.5D高级"
id: "2.5d-advanced"
tier: "free"
description: "期刊封面式拟人化细胞叙事插画（自带风格参考图，脚本会自动把它作为风格参考送给图片模型）"
reference_image: "assets/styles/2.5d-advanced.png"
aspect_ratio: "4:5"
reference_max_kb: 400
instructions: |
  视觉风格要求（2.5D 高级 · 期刊封面叙事插画风格）：

  1. 角色化表达
  - 把细胞、分子、蛋白、细胞器拟人化为带表情与肢体的小角色
  - 表情夸张但克制，兼具可爱感与学术黑色幽默（如衰竭/死亡元素也用柔和方式呈现）
  - 角色有体积感与柔和轮廓光，不是扁平图标

  2. 配色方案
  - 低饱和柔和配色：薰衣草紫 / 干枯玫瑰粉 / 淡天蓝 / 奶油黄 / 米白
  - 同色系渐变过渡，避免高饱和纯色与强对比
  - 深灰（非纯黑）描边与文字，保证可读性

  3. 笔触与光影
  - 中等偏粗的圆润描边，略带手绘插画质感
  - 柔和体积光 + 半透明软阴影，整体明亮均匀、无强烈明暗对比
  - 局部高光点缀（如发光的小分子、微光边缘）

  4. 版式与构图
  - 顶部预留大标题区（期刊名 / 卷期 / 年份），字体为粗重圆润的展示体
  - 中央纵向主体构图，主体占画面中心 50%-70%
  - 底部为场景化元素堆叠（如细胞群、组织截面），形成叙事舞台
  - 元素之间用柔和的有机箭头或渐变连线表达机制流程

  5. 背景
  - 柔和渐变景观（天空 -> 沙丘/组织/抽象地貌），营造叙事感而非纯白背景
  - 背景饱和度低于主体，保证主体突出

  6. 细节与准确性
  - 细胞器（线粒体、高尔基体、粗面内质网）、DNA 双螺旋、化学结构式需准确绘制
  - 标注文字清晰、无衬线、不截断、不交叉

palette:
