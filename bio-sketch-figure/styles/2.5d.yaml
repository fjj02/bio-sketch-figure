name: "2.5D 科研风格"
id: "2.5d"
tier: "free"
description: "精致的 2.5D 半立体科研配图风格，适合期刊封面和 Graphical Abstract"
instructions: |
  视觉风格要求（2.5D 半立体科研风格）：

  1. 整体风格
  - 2.5D 半立体风格，兼具平面清晰度和立体层次感
  - 类似 Nature/Cell 期刊的 Graphical Abstract 风格
  - 干净、现代的矢量感渲染，柔和的三维光影
  - 背景为干净的渐变浅色背景（米白/浅灰渐变），突显主体

  2. 配色方案
  - 明亮、专业的学术配色（柔和粉色、治疗蓝、薄荷青）
  - 主体使用渐变色增强立体感
  - 避免使用过于鲜艳的纯色
  - 文字标签使用深灰色，确保可读性

  3. 视觉元素
  - 分子/细胞结构用 2.5D 建模方式呈现（软阴影、半透明重叠）
  - 使用优雅的细线有机箭头连接机制流程
  - 箭头为半透明、带柔和渐变
  - 文本标签使用干净的无衬线字体，指向特定元素

  4. 构图规范
  - 多尺度逻辑流布局（自上而下或从左到右）
  - 顶部：分子级细节（DNA、蛋白质、代谢物等）
  - 中部：细胞/组织环境截面（信号通路、细胞动态）
  - 底部/侧边：宏观视角（模式生物、人群层面）
  - 各层级之间用柔和渐变或箭头过渡

  5. 光照效果
  - 柔和均匀的顶光照明
  - 主体边缘有轻微高光
  - 阴影柔和、半透明
  - 整体亮度均匀，无强烈明暗对比

palette:
  - "#F3B6C8"
  - "#5B9BD5"
  - "#7FD4C1"
  - "#F5EFE6"
  - "#4A4A4A"
