instructions: |
  视觉风格要求（2.5D 柔彩机制图 · 半立体生物医学插画风格）：

  1. 整体风格
  - 2.5D 半立体科学插画：元素有轻微体积感、柔和阴影与高光，但无写实纹理、无照片感
  - 介于扁平矢量与真实 3D 之间：轮廓干净、边缘锐利、内部简化，整体像专业期刊（Nature / Cell 系）的机制示意图
  - 可适度使用轻微等轴测 / 斜角透视，让跨膜蛋白、细胞、分子有层次堆叠感，但不过度夸张

  2. 配色方案
  - 低饱和柔和配色：浅蓝 / 薄荷青 / 淡紫 / 珊瑚粉 / 暖金 / 橄榄绿
  - 功能导向配色：同一通路或同一类元素使用同一色系；激活 / 正向用暖色，抑制 / 负向用冷色
  - 背景为柔和渐变（浅蓝 ↔ 米白 ↔ 淡粉），无纹理、无噪点
  - 文字与描边使用深灰（非纯黑），保证清晰可读

  3. 元素造型
  - 分子 / 蛋白 / 细胞器用几何化图标表达：圆柱或桶状（跨膜蛋白）、球体（离子、细胞因子）、圆角矩形（酶 / 受体模块）、椭圆（细胞）
  - 细胞膜用磷脂双分子层表示：头基为规则排列的小圆 / 椭圆，尾链为成对的短须线
  - 元素带柔和体积光与浅浅投影，颜色用同色系渐变填充，避免生硬的纯色平涂
  - 关键修饰位点用统一小标记（如 P 代表磷酸化、Ub 代表泛素化）

  4. 版式与构图
  - 模块化布局：按生物学流程分区（膜上 / 胞内 / 核内，或左→右 / 上→下）
  - 主体居中或沿主线排布，留白充足（四周留白不少于画面 15%），信息密度适中
  - 关键节点适度放大，次要分子分散排布，避免拥挤与线条交叉

  5. 连接与箭头
  - 实线箭头：直接激活 / 转化 / 转运
  - 虚线箭头：间接调控 / 反馈 / 易化扩散
  - 抑制关系可用钝头线或 STOP 标记
  - 箭头颜色与所连接元素的色系协调，避免喧宾夺主

  6. 文字与标注
  - 全图标注使用无衬线字体，字号分层清晰（标题 > 模块名 > 分子名 > 小注释）
  - 分子 / 蛋白名使用标准缩写，必要时括号标注全称
  - 文字放置于元素旁或圆角标签框内，不遮挡主体、不交叉
  - 若使用中文，采用思源黑体 / 微软雅黑一类的无衬线体
